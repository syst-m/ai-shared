# Orca dev sandbox: 1 replica, 120Gi iSCSI-backed workspace.
#
# ORCA_PAIRING_ADDRESS is hardcoded to the LoadBalancer IP assigned by MetalLB
# (orca-dev-lb -> 10.10.111.138). Orca advertises this to pairing clients at
# startup, so it must be a real reachable address before the pod starts. If the
# LB service is ever recreated and gets a different IP, update this value and
# `kubectl rollout restart statefulset/orca-dev -n ade-sandbox`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orca-dev
  namespace: ade-sandbox
  labels:
    app: orca-dev
spec:
  serviceName: orca-dev
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: orca-dev
  template:
    metadata:
      labels:
        app: orca-dev
    spec:
      # Image runs as uid/gid 1000 (`orca`). fsGroup makes kubelet chown the
      # freshly-formatted ext4 volume so the service user can write to it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      # Seeds ~/.codex and ~/.claude from the ConfigMap. The config files must
      # land in a *writable* directory — the CLIs write state (sessions, history,
      # ~/.claude.json) alongside them, and the Orca runtime installs its own
      # hooks into ~/.claude/settings.json, so a read-only ConfigMap mount
      # straight onto ~/.claude breaks them. emptyDir + copy-if-absent keeps
      # them writable, and "if absent" means a real home-dir volume (later) wins
      # over the seeded default instead of being clobbered by it.
      initContainers:
        - name: seed-agent-config
          image: 10.10.111.134:5000/ade-sandbox/orca:latest
          imagePullPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              # Absolute paths, not $HOME: kubelet does not guarantee HOME is
              # set for a container whose USER comes from the image config.
              set -eu
              home=/home/orca
              mkdir -p "$home/.codex" "$home/.claude"
              [ -f "$home/.codex/config.toml" ]   || cp /opt/agent-config/codex-config.toml "$home/.codex/config.toml"
              [ -f "$home/.claude/settings.json" ] || cp /opt/agent-config/claude-settings.json "$home/.claude/settings.json"
              ls -l "$home/.codex/config.toml" "$home/.claude/settings.json"
              # Only files destined for a mounted path belong here: anything this
              # container writes to a bare $HOME path lives on the init
              # container's own filesystem layer and dies when it exits. That is
              # why ~/.mcp.json is mounted directly (mcp-config below) instead
              # of copied.
          # No fsGroup here — it's pod-level only (set above), and kubelet
          # applies it to the emptyDirs so uid/gid 1000 can write them.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: agent-config
              mountPath: /opt/agent-config
              readOnly: true
            - name: codex-config
              mountPath: /home/orca/.codex
            - name: claude-config
              mountPath: /home/orca/.claude
      containers:
        - name: orca
          image: 10.10.111.134:5000/ade-sandbox/orca:latest
          # :latest is mutable here; Always so a rebuild+push is picked up on
          # the next pod start. Switch to a digest for pinning.
          imagePullPolicy: Always
          ports:
            - name: orca
              containerPort: 6768
          env:
            - name: ORCA_PORT
              value: "6768"
            - name: ORCA_PAIRING_ADDRESS
              value: "10.10.111.138"
            # Credentials for the agent CLIs (claude / codex / gh). Values come
            # from the ade-agent-keys Secret; see k8s/create-agent-secret.sh.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ade-agent-keys
                  key: ANTHROPIC_API_KEY
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ade-agent-keys
                  key: ANTHROPIC_AUTH_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ade-agent-keys
                  key: OPENAI_API_KEY
            # gh reads GH_TOKEN (preferred over GITHUB_TOKEN) and is then fully
            # authenticated without a ~/.config/gh/hosts.yml. optional: true
            # keeps the pod schedulable if the Secret predates this key.
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ade-agent-keys
                  key: GH_TOKEN
                  optional: true
          # Non-secret agent env (ANTHROPIC_BASE_URL, CLAUDE_CODE_* token limits,
          # OPENAI_BASE_URL). File-bearing keys live in a separate ConfigMap so
          # envFrom doesn't try to export them as env vars.
          envFrom:
            - configMapRef:
                name: ade-agent-env
          # Only ~/workspace is persistent (see README: everything under $HOME
          # outside workspace is ephemeral and resets with the pod). ~/.codex
          # and ~/.claude are emptyDir-backed and reseeded each pod start.
          volumeMounts:
            - name: workspace
              mountPath: /home/orca/workspace
            - name: codex-config
              mountPath: /home/orca/.codex
            - name: claude-config
              mountPath: /home/orca/.claude
            # Claude Code reads ~/.mcp.json as user-scoped MCP config, on top of
            # any .mcp.json in an opened project root. Mounted as a single file
            # (subPath) rather than seeded by the init container, because a bare
            # $HOME path is not a volume.
            - name: mcp-config
              mountPath: /home/orca/.mcp.json
              subPath: .mcp.json
              readOnly: true
          # Orca boots its own Xvfb and takes ~60-90s to bind the socket.
          startupProbe:
            tcpSocket:
              port: orca
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: orca
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: orca
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: agent-config
          configMap:
            name: ade-agent-files
        - name: codex-config
          emptyDir: {}
        - name: claude-config
          emptyDir: {}
        # Projects just the one key, renamed: mcp.json -> .mcp.json.
        - name: mcp-config
          configMap:
            name: ade-agent-files
            items:
              - key: mcp.json
                path: .mcp.json
  volumeClaimTemplates:
    - metadata:
        name: workspace
        labels:
          app: orca-dev
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-ext4
        resources:
          requests:
            storage: 120Gi
