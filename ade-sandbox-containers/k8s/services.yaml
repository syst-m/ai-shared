# Services for the two sandbox runtimes.
#
# Applied BEFORE the StatefulSets: Orca advertises a pairing address to clients
# at startup, so the LoadBalancer IP has to exist before the pod starts. Read the
# assigned IPs after `kubectl apply` and feed them into the StatefulSet specs.
#
#   kubectl apply -f k8s/namespace.yaml -f k8s/services.yaml
#   kubectl -n ade-sandbox get svc -w
#
# Namespaces are explicit: `kubectl apply -f a.yaml -f b.yaml` does NOT inherit a
# namespace from one file into the next, so anything without one lands in default.
---
# Governing (headless) service for the Orca StatefulSet. Gives the pod a stable
# DNS name: orca-dev-0.orca-dev.ade-sandbox.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: orca-dev
  namespace: ade-sandbox
  labels:
    app: orca-dev
spec:
  clusterIP: None
  selector:
    app: orca-dev
  ports:
    - name: orca
      port: 6768
      targetPort: orca
---
# External entrypoint for Orca. MetalLB pool `serv-net` (10.10.111.128/25).
apiVersion: v1
kind: Service
metadata:
  name: orca-dev-lb
  namespace: ade-sandbox
  labels:
    app: orca-dev
spec:
  type: LoadBalancer
  selector:
    app: orca-dev
  ports:
    - name: orca
      port: 6768
      targetPort: orca
---
# Governing (headless) service for the cmux StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: cmux-dev
  namespace: ade-sandbox
  labels:
    app: cmux-dev
spec:
  clusterIP: None
  selector:
    app: cmux-dev
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
---
# External entrypoint for cmux SSH: `cmux ssh -p 2222 cmux@<lb-ip>`
apiVersion: v1
kind: Service
metadata:
  name: cmux-dev-lb
  namespace: ade-sandbox
  labels:
    app: cmux-dev
spec:
  type: LoadBalancer
  selector:
    app: cmux-dev
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
