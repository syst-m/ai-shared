[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amc-showtimes"
version = "0.1.0"
description = "AMC Theatres API integration tool — find theaters, showtimes, movies, and premium formats"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
amc-showtimes = "amc_showtimes.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
