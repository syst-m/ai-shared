name: CI Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'k8s-manifests/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'k8s-manifests/**'

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test + Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        run: go mod download
      - name: Run tests with coverage
        run: |
          go clean -testcache
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...
          grep -v "/internal/k8s/" coverage.out > filtered.out
          go tool cover -func=coverage.out -o coverage-report.txt
          cat coverage-report.txt | grep "total:"
          echo "--- (excluding k8s wrapper code)"
          go tool cover -func=filtered.out | grep "total:"
      - name: Coverage gate (>= 50%)
        run: |
          COVERAGE=$(go tool cover -func=filtered.out | grep "total:" | awk '{print $3}' | tr -d '%')
          if [ "$COVERAGE" -lt 50 ] 2>/dev/null; then
            echo "::error::Coverage ${COVERAGE}% is below 50% threshold (business logic only, k8s wrapper excluded)"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets 50% threshold (business logic only)"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: |
          export PATH="$HOME/go/bin:$PATH"
          golangci-lint run --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -include=G101,G102,G103,G106,G108,G109,G201,G202,G203,G204,G301,G302,G303,G401,G402,G403,G404,G501,G502,G601,G602 -exclude=G117,G304 -severity medium ./...

  build-and-push:
    name: Build + Push to GHCR
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log image digest
        run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
