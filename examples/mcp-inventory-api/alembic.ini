[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# The URL is resolved at runtime: env var MCPINVENTORY_DATABASE_URL takes
# precedence, then this value. Tests override it programmatically.
sqlalchemy.url = postgresql+psycopg://mcp:mcp@localhost:5432/mcp_inventory

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
