services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_inventory}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host port: the api reaches the db over the compose network.
    # Inspect with: docker compose exec db psql -U ${POSTGRES_USER:-mcp} -d ${POSTGRES_DB:-mcp_inventory}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: on-failure
    environment:
      MCPINVENTORY_DATABASE_URL: ${MCPINVENTORY_DATABASE_URL:-postgresql+psycopg://mcp:mcp@db:5432/mcp_inventory}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
